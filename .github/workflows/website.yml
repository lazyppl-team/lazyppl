name: Publish Website

# Automatic website checks run in CI; this workflow rebuilds the verified tree on manual dispatch.
# It only builds and checks: the live site has a publisher of its own, and nothing here can write
# to lazyppl-team/lazyppl-team.github.io.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # Download the immutable playground artifact from CI at this exact source commit.

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: lazyppl
          persist-credentials: false

      - name: Checkout lazyppl_physics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lazyppl-team/lazyppl_physics
          # Same ref as ci.yml, so the page that is checked is the page that is generated; move both together.
          ref: f166b3f6429e055ba3b9b7e4ea12774bf48f6176
          path: lazyppl_physics
          persist-credentials: false

      - name: Checkout the published site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lazyppl-team/lazyppl-team.github.io
          # The checked tree starts from the site as published, at its current head, so that the checks run against
          # the real site. Read-only: nothing in this workflow writes to the site repository.
          path: lazyppl-team.github.io
          persist-credentials: false

      - name: Find the tested playground at this source commit
        id: playground-run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          run_id=$(gh run list --repo "$SOURCE_REPO" --workflow ci.yml --commit "$SOURCE_REVISION" --status success --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "CI must complete successfully at ${SOURCE_REVISION} before its tested playground can be used." >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download tested playground
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4; exact bytes from the browser job.
        with:
          name: lazyppl-playground
          path: tested-playground
          github-token: ${{ github.token }}
          run-id: ${{ steps.playground-run.outputs.run-id }}

      - name: Set up Pandoc
        uses: nikeee/setup-pandoc@96d7406a408cae3f939dfe9222420c5b9ff9cfbb # v1
        with:
          pandoc-version: '3.12.1'

      - name: Generate and verify website
        working-directory: lazyppl
        env:
          LAZYPPL_PLAYGROUND_DIR: ${{ github.workspace }}/tested-playground
          LAZYPPL_SOURCE_REVISION: ${{ github.sha }}
          LAZYPPL_PHYSICS_DIR: ${{ github.workspace }}/lazyppl_physics
          LAZYPPL_SITE_BASE: ${{ github.workspace }}/lazyppl-team.github.io
          LAZYPPL_PAGE_LIST: ${{ runner.temp }}/pages.txt
        run: |
          bash generate_website.sh
          bash pandoc/golden.sh check

      - name: Check website links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --files-from ${{ runner.temp }}/pages.txt
          output: /tmp/lychee-out.md

      - name: Upload website artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lazyppl-website
          path: lazyppl/website/
          # The tree holds the site's own dotfiles (.gitignore, .vscode), so the artifact is the complete site.
          include-hidden-files: true
          if-no-files-found: error
